name: Verify website release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull main explicitly
        if: github.event_name == 'push'
        run: git pull origin main

      - name: Verify source cleanup
        run: |
          mkdir -p evidence
          echo "HEAD=$(git rev-parse HEAD)" | tee evidence/head.txt
          echo "=== FINAL: #fff/#000 ===" | tee evidence/colors-final.txt
          grep -rnE "#fff|#000" src/ | tee -a evidence/colors-final.txt || true
          echo "=== FINAL: direct font-size ===" | tee evidence/fonts-final.txt
          grep -rnE "font-size: [0-9]" src/ | tee -a evidence/fonts-final.txt || true
          test "$(grep -rnE '#fff|#000' src/ | wc -l)" -eq 0
          test "$(grep -rnE 'font-size: [0-9]' src/ | wc -l)" -eq 0
          grep -q "import './ultimate-rebuild.css';" src/main.tsx
          grep -q "import './detail-rebuild.css';" src/main.tsx
          grep -q "onSelectRelated={(product) => setSelectedProduct(product)}" src/App.tsx

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify static route metadata
        run: |
          set -e
          grep -q "Stone Surfaces | NATURAL &amp; ENGINEERED STONE\|Stone Surfaces | NATURAL & ENGINEERED STONE" dist/index.html
          grep -q "Vietnam Stone Factory | NATURAL &amp; ENGINEERED STONE\|Vietnam Stone Factory | NATURAL & ENGINEERED STONE" dist/factory/index.html
          grep -q "Marble | NATURAL &amp; ENGINEERED STONE\|Marble | NATURAL & ENGINEERED STONE" dist/materials/marble/index.html
          grep -q "assets/materials/white-marble-v2.jpg" dist/materials/marble/index.html
          grep -q "Alpine Carrara Marble | NATURAL &amp; ENGINEERED STONE\|Alpine Carrara Marble | NATURAL & ENGINEERED STONE" dist/colors/alpine-carrara/index.html
          grep -q "Technical Documents | NATURAL &amp; ENGINEERED STONE\|Technical Documents | NATURAL & ENGINEERED STONE" dist/resources/documents/index.html
          grep -q "materials/marble" dist/stone-types/marble/index.html
          grep -q "products/table-tops" dist/products/furniture-tops/index.html
          grep -q "colors/alpine-carrara" dist/sitemap.xml
          grep -q "resources/documents" dist/sitemap.xml
          test ! -d dist/admin

      - name: Verify admin bundle is absent
        run: |
          if find dist/assets -type f -iname '*AdminView*' | grep -q .; then
            echo "AdminView bundle still exists" >&2
            exit 1
          fi
          if grep -R "whiterock_cms_\|David Sterling\|Pacific Rim Stone" dist/assets >/dev/null 2>&1; then
            echo "Fake admin data still exists in bundle" >&2
            exit 1
          fi

      - name: Install browser harness
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > evidence/preview.log 2>&1 &
          echo $! > evidence/preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Preview failed to start" >&2
          exit 1

      - name: Browser verification
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const base = process.env.BASE_URL;
          const executablePath = '/usr/bin/google-chrome';
          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
          const evidence = {};
          const errors = [];

          async function newPage(viewport = { width: 1440, height: 1100 }) {
            const page = await browser.newPage({ viewportSize: viewport });
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console:${page.url()}:${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror:${page.url()}:${err.message}`));
            return page;
          }

          async function load(page, pathname, ready = 'main') {
            const response = await page.goto(`${base}${pathname}`, { waitUntil: 'networkidle' });
            if (!response || !response.ok()) throw new Error(`${pathname} response ${response?.status()}`);
            await page.locator(ready).first().waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(500);
          }

          // Six primary navigation items and independent landing pages.
          const page = await newPage();
          await load(page, '/', 'h1');
          evidence.home = {
            title: await page.title(),
            h1: await page.locator('h1').first().innerText(),
            nav: await page.locator('nav[aria-label="Primary navigation"] [data-nav]').allInnerTexts(),
            buttons: await page.locator('button').count(),
            palette: await page.evaluate(() => {
              const cs = getComputedStyle(document.documentElement);
              return ['--wr-bg','--wr-bg-alt','--wr-ink','--wr-accent'].map(k => [k, cs.getPropertyValue(k).trim()]);
            }),
            fonts: await page.evaluate(() => ({
              h1Family: getComputedStyle(document.querySelector('h1')).fontFamily,
              bodyFamily: getComputedStyle(document.body).fontFamily,
              ebLoaded: document.fonts.check('40px "EB Garamond"'),
              libreLoaded: document.fonts.check('40px "Libre Baskerville"'),
              interLoaded: document.fonts.check('16px Inter'),
            })),
            childOrder: await page.locator('.wr-home').evaluate(el => Array.from(el.children).map(node => node.className || node.tagName)),
          };
          await page.screenshot({ path: 'evidence/home-final.png', fullPage: true });

          const landingPaths = {
            products: '/products/', materials: '/materials/', factory: '/factory/', resources: '/resources/', about: '/about/', contact: '/contact/'
          };
          evidence.landings = {};
          for (const [name, pathname] of Object.entries(landingPaths)) {
            await load(page, pathname, 'main');
            const h1 = page.locator('main h1').first();
            await h1.waitFor({ state: 'visible', timeout: 15000 });
            evidence.landings[name] = { requested: pathname, finalUrl: new URL(page.url()).pathname, title: await page.title(), h1: await h1.innerText() };
            if (new URL(page.url()).pathname !== pathname) throw new Error(`${name} redirected to ${page.url()}`);
            await page.screenshot({ path: `evidence/${name}-landing-final.png`, fullPage: true });
          }

          // Dropdown close behavior: outside, Escape/focus return, switch, route, mouseleave 200ms, scroll >100px.
          await load(page, '/', 'h1');
          const item = id => page.locator(`[data-nav="${id}"]`).locator('xpath=ancestor::div[contains(@class,"wr-nav__item")]');
          const productsLink = page.locator('[data-nav="products"]');
          const materialsLink = page.locator('[data-nav="materials"]');
          const closeChecks = {};
          await productsLink.hover();
          closeChecks.opened = await item('products').evaluate(el => el.classList.contains('is-open'));
          await page.evaluate(() => document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true })));
          closeChecks.outside = !(await item('products').evaluate(el => el.classList.contains('is-open')));
          await productsLink.hover(); await page.keyboard.press('Escape'); await page.waitForTimeout(50);
          closeChecks.escape = !(await item('products').evaluate(el => el.classList.contains('is-open')));
          closeChecks.escapeFocusReturned = await page.evaluate(() => document.activeElement?.getAttribute('data-nav') === 'products');
          await productsLink.hover(); await materialsLink.hover();
          closeChecks.switch = !(await item('products').evaluate(el => el.classList.contains('is-open'))) && (await item('materials').evaluate(el => el.classList.contains('is-open')));
          await productsLink.hover(); await productsLink.click(); await page.waitForURL('**/products/');
          closeChecks.route = (await page.locator('.wr-nav__item.is-open').count()) === 0;
          await load(page, '/', 'h1');
          await productsLink.hover(); await page.mouse.move(1430, 900); await page.waitForTimeout(260);
          closeChecks.mouseleave200 = !(await item('products').evaluate(el => el.classList.contains('is-open')));
          await productsLink.hover(); await page.evaluate(() => window.scrollTo(0, 180)); await page.waitForTimeout(100);
          closeChecks.scroll100 = !(await item('products').evaluate(el => el.classList.contains('is-open')));
          evidence.dropdownClose = closeChecks;
          if (Object.values(closeChecks).some(v => v !== true)) throw new Error(`Dropdown close verification failed: ${JSON.stringify(closeChecks)}`);

          // Stone page modules.
          await load(page, '/materials/marble/', 'main h1');
          const stoneSelectors = ['.wr-stone-type-hero','.wr-stone-character','.wr-stone-tech-viz','.wr-stone-type-colors','.wr-stone-type-fabrication','.wr-stone-type-gallery','.wr-stone-care','.wr-stone-type-documents','.wr-stone-type-applications','.wr-stone-final-cta'];
          evidence.stone = { title: await page.title(), h1: await page.locator('main h1').first().innerText(), modules: {} };
          for (const selector of stoneSelectors) evidence.stone.modules[selector] = await page.locator(selector).count();
          if (Object.values(evidence.stone.modules).some(v => v < 1)) throw new Error(`Stone modules missing: ${JSON.stringify(evidence.stone.modules)}`);
          await page.screenshot({ path: 'evidence/marble-final.png', fullPage: true });

          // Factory four subpages, Resources six subpages, About pages + Contact.
          const groups = {
            factory: ['/factory/overview/','/factory/production/','/factory/quality/','/factory/compliance/'],
            resources: ['/resources/documents/','/resources/cad/','/resources/care/','/resources/packing/','/resources/samples/','/resources/faq/'],
            about: ['/about/','/about/story/','/about/vietnam/','/contact/'],
          };
          evidence.routeGroups = {};
          for (const [group, paths] of Object.entries(groups)) {
            evidence.routeGroups[group] = [];
            for (const pathname of paths) {
              await load(page, pathname, 'main');
              const h1 = page.locator('main h1').first();
              await h1.waitFor({ state: 'visible', timeout: 15000 });
              evidence.routeGroups[group].push({ path: pathname, title: await page.title(), h1: await h1.innerText() });
            }
          }

          // Independent color URL with modal detail and static metadata.
          await load(page, '/colors/alpine-carrara/', '[role="dialog"]');
          evidence.colorDetail = { path: new URL(page.url()).pathname, title: await page.title(), dialogText: (await page.locator('[role="dialog"]').innerText()).slice(0, 500) };
          if (!evidence.colorDetail.dialogText.includes('Alpine Carrara')) throw new Error('Color detail modal did not open for slug URL');
          await page.screenshot({ path: 'evidence/color-detail-final.png', fullPage: true });

          // Related Products: button must change the visible ProductModal product.
          await load(page, '/products/kitchen-countertops/', 'main h1');
          await page.locator('.wr-catalog-card__media').first().click();
          await page.locator('.wr-detail-dialog--product').waitFor({ state: 'visible' });
          const beforeProduct = await page.locator('.wr-modal-header h3').innerText();
          const relatedButton = page.locator('.wr-related-products__grid button').first();
          await relatedButton.scrollIntoViewIfNeeded();
          await relatedButton.click();
          await page.waitForTimeout(150);
          const afterProduct = await page.locator('.wr-modal-header h3').innerText();
          evidence.relatedProduct = { beforeProduct, afterProduct, changed: beforeProduct !== afterProduct };
          if (!evidence.relatedProduct.changed) throw new Error('Related product selection did not change ProductModal content');
          await page.getByRole('button', { name: 'Close product details' }).click();

          // Compare -> Sample -> RFQ flow using color cards.
          await load(page, '/colors/white/', 'main h1');
          const compareButtons = page.getByRole('button', { name: /^Compare$/ });
          const compareCount = await compareButtons.count();
          if (compareCount < 2) throw new Error(`Need 2 color compare buttons; found ${compareCount}`);
          await compareButtons.nth(0).click();
          await compareButtons.nth(1).click();
          const tray = page.locator('.wr-compare-tray');
          await tray.waitFor({ state: 'visible' });
          await tray.getByRole('button', { name: /^Compare$/ }).click();
          const compareDialog = page.locator('.wr-compare-dialog');
          await compareDialog.waitFor({ state: 'visible' });
          await compareDialog.getByRole('button', { name: 'Add colors to Sample Box' }).click();
          await compareDialog.getByRole('button', { name: 'Add colors to RFQ' }).click();
          evidence.compareFlow = await page.evaluate(() => ({
            sampleBox: JSON.parse(localStorage.getItem('whiterock_sample_box') || '[]'),
            rfqCart: JSON.parse(localStorage.getItem('whiterock_rfq_cart') || '[]'),
          }));
          if (evidence.compareFlow.sampleBox.length < 2 || evidence.compareFlow.rfqCart.length < 2) throw new Error(`Compare flow storage not populated: ${JSON.stringify(evidence.compareFlow)}`);
          await compareDialog.getByRole('button', { name: 'Done' }).click();
          await page.getByRole('button', { name: /RFQ/ }).last().click();
          await page.locator('[role="dialog"]').last().waitFor({ state: 'visible' });
          evidence.compareFlow.rfqDialogOpened = true;
          await page.screenshot({ path: 'evidence/compare-rfq-final.png', fullPage: true });

          // 390px and 1024px overflow checks + screenshots.
          for (const [label, viewport] of Object.entries({ mobile390: { width: 390, height: 844 }, tablet1024: { width: 1024, height: 1000 } })) {
            const p2 = await newPage(viewport);
            await load(p2, '/', 'h1');
            const dims = await p2.evaluate(() => ({ innerWidth: window.innerWidth, scrollWidth: document.documentElement.scrollWidth }));
            evidence[label] = dims;
            if (dims.scrollWidth > dims.innerWidth + 1) throw new Error(`${label} horizontal overflow ${JSON.stringify(dims)}`);
            await p2.screenshot({ path: `evidence/${label}-final.png`, fullPage: true });
            await p2.close();
          }

          // Five explicit F-section captures.
          const capture = [
            ['index','/','h1'], ['factory','/factory/','main h1'], ['marble','/materials/marble/','main h1'], ['alpine','/colors/alpine-carrara/','[role="dialog"]'], ['resource-docs','/resources/documents/','main h1']
          ];
          evidence.explicitPages = {};
          for (const [name, pathname, ready] of capture) {
            await load(page, pathname, ready);
            evidence.explicitPages[name] = {
              title: await page.title(),
              h1: await page.locator('main h1').count() ? await page.locator('main h1').first().innerText() : null,
              nav: await page.locator('nav[aria-label="Primary navigation"] [data-nav]').allInnerTexts(),
              buttons: await page.locator('button').count(),
              ogImage: await page.locator('meta[property="og:image"]').getAttribute('content'),
            };
            await page.screenshot({ path: `evidence/${name}-final.png`, fullPage: true });
          }

          await fs.writeFile('evidence/browser-verification.json', JSON.stringify(evidence, null, 2));
          await fs.writeFile('evidence/browser-errors.txt', errors.join('\n') + (errors.length ? '\n' : ''));
          console.log(JSON.stringify(evidence, null, 2));
          if (errors.length) throw new Error(`Browser console/page errors: ${errors.join(' | ')}`);
          await browser.close();
          NODE

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiterock-final-verification-evidence
          path: |
            evidence/
            dist/
          retention-days: 7
